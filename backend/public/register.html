<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Multi-AI Chatbot</title>
    <meta name="description" content="Create account for Multi-AI Chatbot with access to OpenRouter, Claude, GPT-4, and more">
    <meta name="keywords" content="AI chatbot register, create account, multi-ai, openrouter signup">
    <link rel="canonical" href="https://multi-ai-chatbot-production.up.railway.app/register">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --accent: #10b981;
            --error: #ef4444;
            --bg-dark: #0f172a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 48px;
            color: var(--primary-light);
            margin-bottom: 15px;
            display: block;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }

        .strength-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 5px 0;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak .strength-fill { width: 33%; background: var(--error); }
        .strength-medium .strength-fill { width: 66%; background: #f59e0b; }
        .strength-strong .strength-fill { width: 100%; background: var(--accent); }

        .register-btn {
            width: 100%;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .register-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
        }

        .login-link a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 2px;
        }

        .checkbox-group label {
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            .register-container {
                padding: 30px 20px;
                margin: 0 10px;
            }
            
            .logo i {
                font-size: 36px;
            }
            
            .logo h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <i class="fas fa-user-plus"></i>
            <h1>Create Account</h1>
            <p>Join Multi-AI Chatbot</p>
        </div>

        <div id="alert" class="alert" style="display: none;"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    class="form-input" 
                    placeholder="Your full name" 
                    required 
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-input" 
                    placeholder="your@email.com" 
                    required 
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Create a strong password" 
                    required 
                    autocomplete="new-password"
                >
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill"></div>
                    </div>
                    <span id="strengthText">Password strength</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    class="form-input" 
                    placeholder="Confirm your password" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I agree to the Terms of Service and Privacy Policy. I understand this chatbot uses multiple AI providers and my conversations may be processed by third-party services.
                </label>
            </div>

            <button type="submit" class="register-btn" id="registerBtn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="login-link">
            <a href="login.html">Already have an account? Sign in</a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://multi-ai-chatbot-production.up.railway.app/api';
        
        const elements = {
            registerForm: document.getElementById('registerForm'),
            name: document.getElementById('name'),
            email: document.getElementById('email'),
            password: document.getElementById('password'),
            confirmPassword: document.getElementById('confirmPassword'),
            terms: document.getElementById('terms'),
            registerBtn: document.getElementById('registerBtn'),
            alert: document.getElementById('alert'),
            strengthText: document.getElementById('strengthText')
        };

        function showAlert(message, type) {
            elements.alert.textContent = message;
            elements.alert.className = `alert ${type}`;
            elements.alert.style.display = 'block';
        }

        function hideAlert() {
            elements.alert.style.display = 'none';
        }

        function checkPasswordStrength(password) {
            const strengthBar = document.querySelector('.password-strength');
            const strengthFill = document.querySelector('.strength-fill');
            
            let strength = 0;
            let feedback = [];
            
            if (password.length >= 8) strength++;
            else feedback.push('At least 8 characters');
            
            if (/[a-z]/.test(password)) strength++;
            else feedback.push('Lowercase letter');
            
            if (/[A-Z]/.test(password)) strength++;
            else feedback.push('Uppercase letter');
            
            if (/\d/.test(password)) strength++;
            else feedback.push('Number');
            
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            else feedback.push('Special character');
            
            // Update UI
            strengthBar.className = 'password-strength';
            
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
                elements.strengthText.textContent = `Weak: Need ${feedback.slice(0, 2).join(', ')}`;
            } else if (strength <= 3) {
                strengthBar.classList.add('strength-medium');
                elements.strengthText.textContent = `Medium: Add ${feedback.join(', ')}`;
            } else {
                strengthBar.classList.add('strength-strong');
                elements.strengthText.textContent = 'Strong password';
            }
            
            return strength >= 3;
        }

        elements.password.addEventListener('input', (e) => {
            checkPasswordStrength(e.target.value);
        });

        elements.registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const name = elements.name.value.trim();
            const email = elements.email.value.trim();
            const password = elements.password.value;
            const confirmPassword = elements.confirmPassword.value;
            const terms = elements.terms.checked;

            // Validation
            if (!name || !email || !password || !confirmPassword) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            if (!checkPasswordStrength(password)) {
                showAlert('Please use a stronger password', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            if (!terms) {
                showAlert('Please accept the terms and conditions', 'error');
                return;
            }

            elements.registerBtn.disabled = true;
            elements.registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Account created successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Registration failed', 'error');
                }

            } catch (error) {
                showAlert('Connection error. Please try again.', 'error');
            } finally {
                elements.registerBtn.disabled = false;
                elements.registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });

        // Check if already logged in
        fetch(`${API_BASE}/auth/me`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.user) {
                    window.location.href = '/';
                }
            })
            .catch(() => {
                // User not logged in, stay on register page
            });
    </script>
</body>
</html>
